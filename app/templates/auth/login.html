<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Criar conta | Spoken</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#f9fafb;font-family:system-ui;padding:24px}.panel{width:min(100%,440px);background:#1f2937;border:1px solid #374151;border-radius:20px;padding:32px}p,small{color:#cbd5e1}.field{display:block;margin:18px 0 6px}input{width:100%;padding:13px;border:1px solid #4b5563;border-radius:10px;background:#111827;color:white;font:inherit}button,.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#818cf8;color:#111827;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;margin-top:18px}.google{background:white}.flash{padding:10px;background:#7f1d1d;border-radius:8px;margin:10px 0}.muted{text-align:center;font-size:14px}.muted a{color:#a5b4fc}</style></head>
<body><main class="panel"><h1>Criar sua conta</h1><p>Comece a praticar com a Suelen.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field" for="name">Nome</label><input id="name" name="name" maxlength="120" autocomplete="name" required><label class="field" for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required><label class="field" for="password">Senha</label><input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><small>Mínimo de 10 caracteres.</small><button>Criar conta</button></form>
<p style="text-align:center">ou</p><a class="btn google" href="{{ url_for('auth.google_login') }}">Cadastrar com Google</a><p class="muted">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p></main></body></html>
